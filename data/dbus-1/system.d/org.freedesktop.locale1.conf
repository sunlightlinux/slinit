<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- slinit-localed: org.freedesktop.locale1.

     Only root may own the name. Anyone may call it: every change is
     authorized by polkit inside slinit-localed (and only root is let
     through when polkitd is not running), so the bus does not need to
     gate the calls itself. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.locale1"/>
    <allow send_destination="org.freedesktop.locale1"/>
    <allow receive_sender="org.freedesktop.locale1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.locale1"/>
    <allow receive_sender="org.freedesktop.locale1"/>
  </policy>
</busconfig>
