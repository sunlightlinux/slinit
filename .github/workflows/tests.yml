# Functional (QEMU) + fuzz suites, on every pull request.
#
# Why this exists: until now nothing ran the test suites in CI. The SLSA
# workflow builds release binaries and tarball-verify runs `go test` —
# but only on `release: created` and `workflow_dispatch`, so no branch and
# no pull request was ever checked by anything. A contributor had no way
# to know whether their change broke one of the 228 functional cases
# short of owning a machine and running them.
#
# What is deliberately NOT here: the acceptance (SSH), container (Docker)
# and k8s (kind) tiers. Those need a live target — a VM or a real PC — and
# are run downstream rather than pretended at in a runner.
#
# No KVM is required. tests/functional/run-tests.sh checks for a writable
# /dev/kvm and falls back to `-cpu qemu64`, which is software emulation
# and measured at 1.47x the KVM time on the maintainer's box (14.6s vs
# 21.5s per case) — far from the order of magnitude emulation usually
# costs, because these cases wait on sleeps and boots rather than burning
# CPU. A runner is slower still, which is what the sharding is for.
name: Slinit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The VM image is built once and handed to the shards. Building it in
  # each shard would repeat the Alpine download and the Go build eight
  # times for a byte-identical result.
  vm-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install image-build tools
        run: sudo apt-get update && sudo apt-get install -y cpio

      # build-vm.sh caches the Alpine minirootfs, kernel and packages
      # here. Keyed on the script because that is what pins the Alpine
      # release and the package list.
      - name: Cache Alpine downloads
        uses: actions/cache@v6
        with:
          path: demo/_cache
          key: alpine-${{ hashFiles('tests/functional/build-vm.sh') }}

      - name: Build the VM image
        run: bash tests/functional/build-vm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vm-image
          path: tests/functional/_output/
          retention-days: 1

  functional:
    needs: vm-image
    runs-on: ubuntu-latest
    strategy:
      # One shard failing should not cancel the rest: the point of a CI
      # run is to learn everything that is broken, not the first thing.
      fail-fast: false
      matrix:
        # This list is the only place the shard count lives. The split
        # below reads strategy.job-total rather than a second constant,
        # because a mismatch between the two would silently drop whole
        # slices of the suite instead of failing.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 socat

      - name: Report virtualisation support
        run: |
          # Printed rather than required. If /dev/kvm turns up the suite
          # simply goes faster; the harness decides for itself.
          if [ -w /dev/kvm ]; then
            echo "/dev/kvm is writable — hardware acceleration in use"
          elif [ -e /dev/kvm ]; then
            echo "/dev/kvm exists but is not writable — falling back to emulation"
            ls -l /dev/kvm
          else
            echo "no /dev/kvm — falling back to software emulation (TCG)"
          fi
          qemu-system-x86_64 --version | head -1

      - uses: actions/download-artifact@v8
        with:
          name: vm-image
          path: tests/functional/_output/

      - name: Keep the downloaded image from looking stale
        run: |
          # run-tests.sh rebuilds when any file under cmd/ or pkg/ is
          # newer than the initramfs. Artifact extraction does not
          # preserve mtimes, so without this the shard may decide the
          # image it was just handed is out of date and spend minutes
          # rebuilding an identical one.
          touch tests/functional/_output/*

      - name: Select this shard's cases
        id: cases
        run: |
          # Chosen by index so the split is deterministic and every case
          # lands in exactly one shard. Discovered from the directory
          # rather than listed here: a workflow holding its own copy of
          # the case list goes stale the first time someone adds one.
          # k comes from the matrix value, not strategy.job-index: the two
          # are not the same, and the job label shows the matrix value. A
          # run where "functional (5)" had actually selected index 4 sent
          # a debugging session looking at the wrong 28 cases. n still
          # comes from job-total so it cannot desync from the list length.
          cases=$(ls tests/functional/cases/*.sh | \
            awk -v n="${{ strategy.job-total }}" -v k="${{ matrix.shard }}" \
                'NR % n == k { printf "%s ", $0 }')
          if [ -z "${cases}" ]; then
            echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} selected no cases" >&2
            exit 1
          fi
          echo "count=$(echo ${cases} | wc -w)" >> "$GITHUB_OUTPUT"
          echo "list=${cases}" >> "$GITHUB_OUTPUT"
          # Printed so a failing shard can be mapped back to its cases
          # from the log alone, which is the one thing you want and cannot
          # reconstruct when a run has gone red.
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} runs:"
          for c in ${cases}; do echo "  ${c}"; done

      - name: Run ${{ steps.cases.outputs.count }} functional cases
        env:
          # The image came from the artifact; keep it and do not rebuild.
          KEEP_BUILD: "1"
          # Per-case budget, raised from the 60s default because the runner
          # has no KVM. The 1.47x emulation penalty measured when this
          # workflow was written does NOT generalise: it came from cases
          # that wait on sleeps, and a case that spawns slinitctl in a poll
          # loop pays Go process startup under TCG instead. Case 181 runs
          # in 12s with KVM and about 60s without — right on the old budget,
          # so it passed or failed depending on which side of it the run
          # landed. 180s leaves headroom without hiding a genuinely wedged
          # guest, which now fails in TIMEOUT seconds rather than ~16x it.
          TIMEOUT: "180"
        run: bash tests/functional/run-tests.sh ${{ steps.cases.outputs.list }}

      # A failed case leaves its console log behind, which is the only way
      # to tell a real failure from a VM that never booted.
      #
      # These paths were wrong from the start and nothing said so. The
      # globs were tests/functional/_output/*.log and
      # tests/functional/log.txt: _output holds only the kernel and the
      # initramfs (zero .log matches) and log.txt does not exist at all.
      # run-tests.sh writes per-case logs under _build/test-<case>/. With
      # if-no-files-found: ignore on top, every failing run uploaded an
      # empty artifact in silence — which is why three earlier failures
      # (116, 167, 220) could not be diagnosed from CI and were each
      # written off as "need the artifact".
      #
      # warn, not ignore, so the next time these paths drift it is said
      # out loud instead of leaving a future session with nothing again.
      #
      # The name uses matrix.shard rather than strategy.job-index: those
      # are not the same number, the job label shows the matrix value, and
      # an artifact named after the other one sends whoever downloads it
      # to the wrong case list.
      - name: Upload console logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-logs-shard-${{ matrix.shard }}
          path: |
            tests/functional/_build/*/console.log
            tests/functional/_build/*/qemu-stderr.log
            tests/functional/_build/*/result.txt
          if-no-files-found: warn
          retention-days: 7

  # Performance harnesses, run as a smoke test and not as a measurement.
  #
  # The numbers a shared runner produces are not comparable with anything —
  # no KVM guarantee, noisy neighbours, variable CPU. Nothing here tracks
  # a regression threshold, and nobody should read the printed
  # milliseconds as slinit's boot time.
  #
  # What this does catch is rot, which these harnesses are unusually prone
  # to: each one injects a service into demo/services/, patches the boot
  # target, rebuilds the initramfs, and parses a PERF-BEGIN..PERF-END
  # block out of serial output. A change to the config parser, to the
  # console format, or to demo/services breaks that silently, and without
  # a job running them nobody would find out for months.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio socat

      # The demo image is a different image from the functional one and
      # each harness rebuilds it, so the Alpine downloads are worth
      # caching even though the build itself is repeated.
      - name: Cache Alpine downloads
        uses: actions/cache@v6
        with:
          path: demo/_cache
          key: alpine-demo-${{ hashFiles('demo/build.sh') }}

      # Iteration counts are cut to the minimum that still exercises the
      # loop: the point is that a boot completes and the block parses, and
      # five samples of an unreliable clock are no better than two.
      - name: cold-boot
        env:
          # cold-boot.sh dumps the full per-service breakdown for any
          # iteration slower than this, to find out which service caused
          # a spike. The 3000ms default is calibrated against a ~2870ms
          # boot on hardware with KVM; a runner boots the same image in
          # ~9900ms, so the default fires every single time and prints
          # forty-odd lines per iteration that diagnose nothing.
          #
          # 12000 is that measured baseline plus about a fifth — still
          # well under the +1s bimodal spikes the dump exists to catch.
          COLD_BOOT_SPIKE_MS: 12000
        run: bash tests/performance/demo/cold-boot.sh 2

      - name: minimal-boot
        run: bash tests/performance/demo/minimal-boot.sh 2

      - name: fork-exec-throughput
        run: bash tests/performance/demo/fork-exec-throughput.sh 50 2

      # First argument is the idle period before the status read, not an
      # iteration count. Shortened from ten seconds because it exists to
      # let PID 1 quiesce, and four is enough for that.
      - name: pid1-footprint
        run: bash tests/performance/demo/pid1-footprint.sh 4 2

      # -benchtime=10x rather than the default second per benchmark: the
      # question is whether they still build and run, and ten iterations
      # answers it in well under a second.
      - name: runtime benchmarks
        run: go test -bench=. -benchtime=10x -run='^$' ./tests/performance/runtime/

  # Fuzzing, as a short burst per target rather than a long campaign.
  # The value in CI is catching a crasher a change introduced, which
  # usually surfaces in seconds; finding deep bugs needs hours and belongs
  # on a machine that has them.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split by package so a slow one does not hold up the rest.
        # tests/fuzz carries 27 of the 40 targets, hence its own shard.
        package:
          - tests/fuzz
          - pkg/config
          - pkg/service
          - cmd/slinit-hostnamectl
          - cmd/slinit-openrc-convert
          - cmd/slinit-runit-convert
          - cmd/slinit-sysusers
          - cmd/slinit-sysvinit-convert
          - cmd/slinit-timedatectl
          - cmd/slinit-tmpfiles
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz every target in ${{ matrix.package }}
        env:
          FUZZTIME: 30s
        run: |
          set -u
          pkg="${{ matrix.package }}"
          # Targets are discovered from the source, not listed in this
          # file, so a new one is fuzzed the moment it is committed.
          targets=$(grep -h '^func Fuzz' "${pkg}"/*_test.go 2>/dev/null \
            | sed 's/^func \(Fuzz[A-Za-z0-9_]*\).*/\1/' | sort -u)
          if [ -z "${targets}" ]; then
            echo "no fuzz targets found in ${pkg} — the matrix entry is stale" >&2
            exit 1
          fi
          echo "targets: $(echo ${targets} | tr '\n' ' ')"
          # go test fuzzes one target per invocation, so this is a loop
          # and not a single -fuzz flag.
          rc=0
          for t in ${targets}; do
            echo "::group::${t}"
            out=$(mktemp)
            if go test "./${pkg}" -run "^${t}$" -fuzz "^${t}$" \
                 -fuzztime "${FUZZTIME}" 2>&1 | tee "${out}"; then
              echo "::endgroup::"
              continue
            fi

            # A fuzz FINDING always writes the offending input to
            # testdata/fuzz/<target>/ and prints the path — that file is
            # what makes it reproducible, and it is committed as the
            # regression corpus. So the file, not the exit status, is what
            # says a bug was found.
            #
            # Without that, `--- FAIL: <target> context deadline exceeded`
            # is Go's own coordinator giving up while shutting its workers
            # down at the end of a timed run: no input to blame, nothing to
            # reproduce. It happened to FuzzDecodeSetEnv on a run that had
            # executed 1.34M inputs cleanly at 45k/sec, and does not
            # reproduce locally (three 30s runs, no crasher written). On a
            # shared runner with four workers the final exchange can simply
            # cross the deadline.
            #
            # Narrow on purpose: only that one message, and only when no
            # input was recorded. Anything else still fails the job.
            #
            # "did Go say it wrote one", not "is the corpus directory
            # empty": several targets already carry a committed regression
            # corpus (FuzzParseCPUAffinity, FuzzJournalBinaryOpenReader),
            # so emptiness would be false for exactly those and could not
            # tell an old corpus entry from a new crasher anyway.
            if grep -q 'context deadline exceeded' "${out}" &&
               ! grep -q 'Failing input written to' "${out}"; then
              echo "::warning title=fuzz coordinator timed out::${t}: Go stopped the run with 'context deadline exceeded' and recorded no input, so there is no finding to reproduce. Not treated as a failure."
            else
              echo "FAIL: ${t}"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "${rc}"

      # A crasher is written under testdata/fuzz/<Target>/ and is the
      # whole output of a failed run — without it the log says a target
      # failed and gives no way to reproduce.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
