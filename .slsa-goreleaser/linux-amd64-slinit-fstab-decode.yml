# SLSA provenance build config for slinit-fstab-decode (linux/amd64).
#
# One config per binary: the SLSA Go builder produces exactly one binary
# per invocation, so each entry in the matrix in
# .github/workflows/slsa-goreleaser.yml needs a file here with a
# matching name. A matrix entry with no config fails build-dry, which
# is how these five were found — the matrix listed them and the files
# were never added, so the release ran with 46 entries against 41
# configs. Add both halves together, or neither works.
#
# CGO_ENABLED=0 diverges from the xbps package, which builds with cgo.
# pkg/utmp has a no-cgo fallback (utmp_other.go), so this compiles, but
# slinit, slinitctl, slinit-shutdown and slinit-logouthookd then record
# nothing to utmp/wtmp. Static, reproducible binaries are the trade.
version: 1
env:
  - GO111MODULE=on
  - CGO_ENABLED=0
flags:
  - -trimpath
goos: linux
goarch: amd64
main: ./cmd/slinit-fstab-decode
binary: slinit-fstab-decode-{{ .Os }}-{{ .Arch }}
